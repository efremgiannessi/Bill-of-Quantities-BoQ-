            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    return (
                        <div className="bg-[#1e1e1e] border border-gray-600 p-3 rounded shadow-2xl opacity-95">
                            <p className="text-gray-300 font-bold text-xs mb-2 uppercase tracking-wider">{label}</p>
                            {payload.map((entry, index) => (
                                <p key={index} className="text-xs font-mono mb-1" style={{ color: entry.color }}>
                                    {entry.name}: {
                                        entry.name.includes('%') 
                                        ? `${Number(entry.value).toFixed(1)}%` 
                                        : `€ ${Number(entry.value).toLocaleString('it-IT', { maximumFractionDigits: 0 })}`
                                    }
                                </p>
                            ))}
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="p-4 md:p-6 animate-fade-in space-y-6">
                    
                    {/* --- ROW 1: EXECUTIVE KPI --- */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg relative overflow-hidden group">
                           <div className="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity"><DollarSign size={60} /></div>
                           <p className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Costi Totali</p>
                           <h3 className="text-2xl font-mono text-gray-200">€ {stats.totalCost.toLocaleString('it-IT', {maximumFractionDigits: 0})}</h3>
                           <div className="mt-2 text-xs text-gray-500 flex items-center gap-1"><Activity size={12} /> OPEX</div>
                        </div>

                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg relative overflow-hidden group">
                           <div className="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity"><FileText size={60} /></div>
                           <p className="text-cyan-400 text-xs font-bold uppercase tracking-wider mb-1">Valore Offerta</p>
                           <h3 className="text-2xl font-mono text-cyan-400 font-bold">€ {stats.totalRevenue.toLocaleString('it-IT', {maximumFractionDigits: 0})}</h3>
                           <div className="mt-2 text-xs text-cyan-500/60 flex items-center gap-1"><Target size={12} /> Target Revenue</div>
                        </div>

                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg relative overflow-hidden group">
                           <div className="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity"><TrendingUp size={60} /></div>
                           <p className="text-lime-400 text-xs font-bold uppercase tracking-wider mb-1">Utile Netto</p>
                           <h3 className="text-2xl font-mono text-lime-400">€ {stats.grossMargin.toLocaleString('it-IT', {maximumFractionDigits: 0})}</h3>
                           <div className="mt-2 text-xs text-lime-500/60 flex items-center gap-1"><ArrowUpRight size={12} /> Cash Flow</div>
                        </div>

                        <div className={`p-5 rounded-lg border shadow-lg relative overflow-hidden group ${stats.marginPercent < 15 ? 'bg-red-900/20 border-red-700' : 'bg-[#252525] border-gray-700'}`}>
                           <div className="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity"><PieIcon size={60} /></div>
                           <p className={`text-xs font-bold uppercase tracking-wider mb-1 ${stats.marginPercent < 15 ? 'text-red-400' : 'text-gray-400'}`}>Marginalità %</p>
                           <h3 className={`text-2xl font-mono font-bold ${stats.marginPercent < 15 ? 'text-red-500' : stats.marginPercent > 20 ? 'text-green-400' : 'text-yellow-400'}`}>
                             {stats.marginPercent.toFixed(1)}%
                           </h3>
                           <div className="mt-2 text-xs text-gray-500 flex items-center gap-1">Media Ponderata</div>
                        </div>

                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg relative overflow-hidden group">
                           <div className="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity"><Activity size={60} /></div>
                           <p className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Voci Totali</p>
                           <h3 className="text-2xl font-mono text-white">{stats.totalItems}</h3>
                           <div className="mt-2 text-xs text-gray-500 flex items-center gap-1">
                             Avg: € {stats.totalItems > 0 ? (stats.totalRevenue / stats.totalItems).toLocaleString('it-IT', {maximumFractionDigits:0}) : 0} / voce
                           </div>
                        </div>
                    </div>

                    {/* --- ROW 2: MAIN CHARTS --- */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* FINANCIAL OVERVIEW (COMPOSED) */}
                        <div className="lg:col-span-2 bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg flex flex-col h-[400px]">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-gray-200 font-bold flex items-center gap-2"><TrendingUp className="text-cyan-400" size={18}/> Analisi Finanziaria per Capitolo</h3>
                                <div className="flex gap-4 text-xs">
                                    <div className="flex items-center gap-1"><div className="w-3 h-3 bg-[#555]"></div> Costi</div>
                                    <div className="flex items-center gap-1"><div className="w-3 h-3 bg-[#00E5FF]"></div> Ricavi</div>
                                    <div className="flex items-center gap-1"><div className="w-3 h-1 bg-[#32CD32]"></div> Margine %</div>
                                </div>
                            </div>
                            <div className="flex-grow">
                                <ResponsiveContainer width="100%" height="100%" minHeight={300}>
                                    <ComposedChart data={stats.categoryPerformance} margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                        <CartesianGrid stroke="#444" strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="name" stroke="#888" tick={{fontSize: 11}} />
                                        <YAxis yAxisId="left" stroke="#888" tick={{fontSize: 11}} tickFormatter={(val) => `€${val/1000}k`} />
                                        <YAxis yAxisId="right" orientation="right" stroke="#32CD32" tick={{fontSize: 11}} unit="%" />
                                        <Tooltip content={<CustomTooltip />} />
                                        <Bar yAxisId="left" dataKey="Costi" fill={COLORS.cost} barSize={20} radius={[4, 4, 0, 0]} />
                                        <Bar yAxisId="left" dataKey="Ricavi" fill={COLORS.revenue} barSize={20} radius={[4, 4, 0, 0]} />
                                        <Line yAxisId="right" type="monotone" dataKey="MarginePerc" stroke={COLORS.profit} strokeWidth={3} dot={{r: 4}} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* RADAR CHART (PROFILE) */}
                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg flex flex-col h-[400px]">
                            <h3 className="text-gray-200 font-bold mb-4 flex items-center gap-2"><Activity className="text-purple-400" size={18}/> Profilo Dimensionale</h3>
                            <div className="flex-grow">
                                <ResponsiveContainer width="100%" height="100%" minHeight={300}>
                                    <RadarChart cx="50%" cy="50%" outerRadius="70%" data={stats.categoryPerformance}>
                                        <PolarGrid stroke="#444" />
                                        <PolarAngleAxis dataKey="name" tick={{ fill: '#aaa', fontSize: 10 }} />
                                        <PolarRadiusAxis angle={30} domain={[0, 'auto']} tick={false} axisLine={false} />
                                        <Radar name="Ricavi" dataKey="Ricavi" stroke="#00E5FF" strokeWidth={2} fill="#00E5FF" fillOpacity={0.3} />
                                        <Radar name="Utile" dataKey="Utile" stroke="#32CD32" strokeWidth={2} fill="#32CD32" fillOpacity={0.5} />
                                        <Legend wrapperStyle={{fontSize: '11px', paddingTop: '10px'}} />
                                        <Tooltip content={<CustomTooltip />} />
                                    </RadarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* --- ROW 3: DEEP DIVE --- */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        
                        {/* SCATTER PLOT (RISK MATRIX) */}
                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg flex flex-col h-[350px]">
                            <h3 className="text-gray-200 font-bold mb-2 flex items-center gap-2">
                                <AlertTriangle className="text-orange-400" size={18}/> Matrice Rischio (Costo vs Margine)
                            </h3>
                            <p className="text-xs text-gray-500 mb-4">Ogni punto è una voce. In alto a destra: Cash Cows. In basso a destra: Rischio Alto.</p>
                            <div className="flex-grow">
                                <ResponsiveContainer width="100%" height="100%" minHeight={250}>
                                    <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                        <CartesianGrid stroke="#444" strokeDasharray="3 3" />
                                        <XAxis type="number" dataKey="cost" name="Costo Tot" unit="€" stroke="#888" tick={{fontSize: 10}} tickFormatter={(val)=> `€${val}`} />
                                        <YAxis type="number" dataKey="marginLimit" name="Margine" unit="%" stroke="#888" tick={{fontSize: 10}} />
                                        <ZAxis type="number" dataKey="revenue" range={[50, 400]} name="Valore" unit="€" />
                                        <Tooltip cursor={{ strokeDasharray: '3 3' }} content={<CustomTooltip />} />
                                        <Scatter name="Voci" data={stats.allItems} fill="#00E5FF" shape="circle" />
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* DONUT CHART (DISTRIBUTION) */}
                        <div className="bg-[#252525] p-5 rounded-lg border border-gray-700 shadow-lg flex flex-col h-[350px]">
                            <h3 className="text-gray-200 font-bold mb-4 flex items-center gap-2"><PieIcon className="text-yellow-400" size={18}/> Distribuzione Costi</h3>
                            <div className="flex-grow flex items-center justify-center">
                                <ResponsiveContainer width="100%" height="100%" minHeight={250}>
                                    <PieChart>
                                        <Pie
                                            data={stats.categoryPerformance}
                                            cx="50%" cy="50%"
                                            innerRadius={60} outerRadius={100}
                                            paddingAngle={5}
                                            dataKey="Costi"
                                        >
                                            {stats.categoryPerformance.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={COLORS.chartColors[index % COLORS.chartColors.length]} stroke="none" />
                                            ))}
                                        </Pie>
                                        <Tooltip content={<CustomTooltip />} />
                                        <Legend layout="vertical" align="right" verticalAlign="middle" wrapperStyle={{fontSize: '11px', color: '#ccc'}} />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* --- ROW 4: TOP MOVERS LISTS --- */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        
                        {/* TOP COSTS */}
                        <div className="bg-[#252525] border border-gray-700 rounded-lg shadow-lg overflow-hidden">
                           <div className="p-4 bg-[#2a2a2a] border-b border-gray-700 flex justify-between items-center">
                              <h3 className="text-gray-200 font-bold text-sm uppercase tracking-wider flex items-center gap-2">
                                 <div className="w-2 h-2 rounded-full bg-red-500"></div> Top 5 Costi Maggiori
                              </h3>
                           </div>
                           <table className="w-full text-left text-sm">
                              <thead className="bg-[#222] text-gray-500 text-xs uppercase">
                                 <tr>
                                    <th className="py-2 px-4">Voce</th>
                                    <th className="py-2 px-4 text-right">Costo Tot.</th>
                                    <th className="py-2 px-4 text-right">Incidenza</th>
                                 </tr>
                              </thead>
                              <tbody className="divide-y divide-gray-800">
                                 {stats.topCostItems.map((item, idx) => (
                                    <tr key={idx} className="hover:bg-[#2f2f2f]">
                                       <td className="py-3 px-4 text-gray-300 truncate max-w-[200px]" title={item.name}>{item.name}</td>
                                       <td className="py-3 px-4 text-right font-mono text-gray-200">€ {item.cost.toLocaleString('it-IT')}</td>
                                       <td className="py-3 px-4 text-right text-xs text-gray-500">
                                          {stats.totalCost > 0 ? ((item.cost / stats.totalCost) * 100).toFixed(1) : 0}%
                                       </td>
                                    </tr>
                                 ))}
                                 {stats.topCostItems.length === 0 && <tr><td colSpan={3} className="py-4 text-center text-gray-500">Nessun dato</td></tr>}
                              </tbody>
                           </table>
                        </div>

                        {/* TOP MARGINS */}
                        <div className="bg-[#252525] border border-gray-700 rounded-lg shadow-lg overflow-hidden">
                           <div className="p-4 bg-[#2a2a2a] border-b border-gray-700 flex justify-between items-center">
                              <h3 className="text-gray-200 font-bold text-sm uppercase tracking-wider flex items-center gap-2">
                                 <div className="w-2 h-2 rounded-full bg-lime-500"></div> Top 5 Migliori Utili
                              </h3>
                           </div>
                           <table className="w-full text-left text-sm">
                              <thead className="bg-[#222] text-gray-500 text-xs uppercase">
                                 <tr>
                                    <th className="py-2 px-4">Voce</th>
                                    <th className="py-2 px-4 text-right">Utile (€)</th>
                                    <th className="py-2 px-4 text-right">Margine %</th>
                                 </tr>
                              </thead>
                              <tbody className="divide-y divide-gray-800">
                                 {stats.topMarginItems.map((item, idx) => (
                                    <tr key={idx} className="hover:bg-[#2f2f2f]">
                                       <td className="py-3 px-4 text-gray-300 truncate max-w-[200px]" title={item.name}>{item.name}</td>
                                       <td className="py-3 px-4 text-right font-mono text-lime-400 font-bold">+ € {item.marginVal.toLocaleString('it-IT')}</td>
                                       <td className="py-3 px-4 text-right text-xs text-gray-400">
                                          {item.marginLimit}%
                                       </td>
                                    </tr>
                                 ))}
                                 {stats.topMarginItems.length === 0 && <tr><td colSpan={3} className="py-4 text-center text-gray-500">Nessun dato</td></tr>}
                              </tbody>
                           </table>
                        </div>

                    </div>

                </div>
            );
        };

        // --- APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(Tab.PRODUCTION);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [materials, setMaterials] = useState(INITIAL_MATERIALS);
            const [machines, setMachines] = useState(INITIAL_MACHINES);
            const [categories, setCategories] = useState(INITIAL_CATEGORIES);

            const handleAddToQuote = (items) => {
                const itemsToAdd = Array.isArray(items) ? items : [items];
                setCategories(prev => {
                    const nextCategories = prev.map(cat => ({ ...cat, items: [...cat.items] }));
                    itemsToAdd.forEach(item => {
                        const targetCat = nextCategories.find(c => c.id === item.categoryId);
                        if (targetCat) targetCat.items.push(item);
                    });
                    return nextCategories;
                });
                setActiveTab(Tab.QUOTE);
                setIsMobileMenuOpen(false);
            };

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsMobileMenuOpen(false);
            };

            const NavButton = ({ tab, icon: Icon, label }) => (
                <button 
                    onClick={() => handleTabChange(tab)}
                    className={`flex items-center gap-3 px-4 py-3 md:py-2 rounded transition-all text-sm font-medium w-full md:w-auto ${activeTab === tab ? 'bg-cyan-900/30 text-cyan-400 border border-cyan-800' : 'text-gray-400 hover:text-white hover:bg-[#333]'}`}
                >
                    <Icon size={18} /> {label}
                </button>
            );

            return (
                <div className="min-h-screen bg-[#1e1e1e] text-gray-200 flex flex-col font-sans selection:bg-cyan-500 selection:text-white">
                    <header className="bg-[#252525] border-b border-gray-700 sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-gradient-to-br from-cyan-500 to-blue-600 rounded flex items-center justify-center font-bold text-white text-xl shadow-lg">E</div>
                                <span className="font-bold text-xl tracking-tight text-white">Executive<span className="text-cyan-400 font-light">Quote</span></span>
                            </div>
                            <nav className="hidden md:flex gap-1">
                                <NavButton tab={Tab.DASHBOARD} icon={LayoutDashboard} label="Dashboard" />
                                <NavButton tab={Tab.PRODUCTION} icon={Factory} label="Calcolo Produzione" />
                                <NavButton tab={Tab.QUOTE} icon={Calculator} label="Preventivo" />
                                <NavButton tab={Tab.DATABASE} icon={Database} label="Database" />
                            </nav>
                            <button className="md:hidden text-gray-300 hover:text-white" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                {isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                            </button>
                        </div>
                        {isMobileMenuOpen && (
                            <nav className="md:hidden bg-[#2a2a2a] border-b border-gray-700 p-4 space-y-2 absolute w-full shadow-2xl animate-in slide-in-from-top-5">
                                <NavButton tab={Tab.DASHBOARD} icon={LayoutDashboard} label="Dashboard" />
                                <NavButton tab={Tab.PRODUCTION} icon={Factory} label="Calcolo Produzione" />
                                <NavButton tab={Tab.QUOTE} icon={Calculator} label="Preventivo" />
                                <NavButton tab={Tab.DATABASE} icon={Database} label="Database" />
                            </nav>
                        )}
                    </header>
                    <main className="flex-grow max-w-7xl mx-auto w-full py-4 md:py-8 px-2 md:px-0">
                        {activeTab === Tab.DASHBOARD && <Dashboard categories={categories} />}
                        {activeTab === Tab.PRODUCTION && <ProductionCalculator materials={materials} machines={machines} categories={categories} onAddToQuote={handleAddToQuote} />}
                        {activeTab === Tab.QUOTE && <GeneralQuote categories={categories} setCategories={setCategories} />}
                        {activeTab === Tab.DATABASE && <DatabaseConfig materials={materials} setMaterials={setMaterials} machines={machines} setMachines={setMachines} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
