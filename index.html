<script type="importmap">

  "imports": {

<body>
    <div id="root"></div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script type="text/babel" data-presets="env,react,typescript">
        // --- GLOBALS & UTILS ---
        const { useState, useEffect, useMemo } = React;
        
        // --- SAFE LIBRARY LOADING (Proxy) ---
        // Prevents "Element type is invalid" errors if a specific icon or chart component is missing
        const createSafeLibrary = (lib, libName) => {
            return new Proxy(lib || {}, {
                get: (target, prop) => {
                    if (prop in target) {
                        return target[prop];
                    }
                    console.warn(`[${libName}] Component '${String(prop)}' is missing or undefined.`);
                    return () => null; // Return dummy component
                }
            });
        };

        // --- ICONS SETUP ---
        const LucideRaw = window.lucideReact || window.lucide || {};
        const LucideSafe = createSafeLibrary(LucideRaw, 'LucideIcons');
        
        // Destructure all used icons
        const { 
            LayoutDashboard, Factory, Calculator, Database, Menu, X, 
            Settings, Plus, Trash2, ArrowRightCircle, Layers, Cuboid, 
            Settings2, ShoppingCart, Hammer, RotateCcw, ChevronDown, 
            ChevronRight, FileText, TrendingUp, DollarSign, 
            PieChart: PieIcon, Activity, Target, AlertTriangle, ArrowUpRight,
            CheckSquare, Square, RefreshCw
        } = LucideSafe;

        // --- CHARTS SETUP ---
        const RechartsRaw = window.Recharts || window.recharts || {};
        const RechartsSafe = createSafeLibrary(RechartsRaw, 'Recharts');
        
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, 
            ResponsiveContainer, Cell, PieChart, Pie, ComposedChart, Line,
            ScatterChart, Scatter, ZAxis, Radar, RadarChart, PolarGrid, 
            PolarAngleAxis, PolarRadiusAxis
        } = RechartsSafe;

        // --- UUID POLYFILL ---
        function uuidv4() {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
            );
        }

        // --- CONSTANTS & DATA ---
        
        // Tab "Enum"
        const Tab = {
            DATABASE: 'DATABASE',
            PRODUCTION: 'PRODUCTION',
            QUOTE: 'QUOTE',
            DASHBOARD: 'DASHBOARD'
        };

        const INITIAL_MATERIALS = [
            // --- METALLI STANDARD ---
            { id: 'm1', name: 'Acciaio S275JR (Lamiera/Profili)', specificGravity: 7.85, defaultCostPerKg: 1.20 },
            { id: 'm2', name: 'Acciaio Inox AISI 304', specificGravity: 7.9, defaultCostPerKg: 4.50 },
            { id: 'm3', name: 'Alluminio 6082', specificGravity: 2.7, defaultCostPerKg: 3.80 },
            { id: 'm4', name: 'Ottone OT58', specificGravity: 8.5, defaultCostPerKg: 7.50 },
            // --- CEMENTO ARMATO & PREFABBRICAZIONE ---
            { id: 'cap1', name: 'Calcestruzzo C35/45 (Standard)', specificGravity: 2.40, defaultCostPerKg: 0.10 }, 
            { id: 'cap2', name: 'Calcestruzzo C45/55 (Strutturale)', specificGravity: 2.50, defaultCostPerKg: 0.12 },
            { id: 'cap3', name: 'Calcestruzzo C50/60 (Alta Res./SCC)', specificGravity: 2.55, defaultCostPerKg: 0.15 },
            { id: 'cap4', name: 'Calcestruzzo Alleggerito (Argilla)', specificGravity: 1.80, defaultCostPerKg: 0.18 },
            // --- ACCIAIO PER CEMENTO ARMATO ---

            { id: 'fer2', name: 'Trefolo 0.5" (12.7mm) Armonico', specificGravity: 7.85, defaultCostPerKg: 1.85 },
            { id: 'fer3', name: 'Barre B450C (Armatura Lenta)', specificGravity: 7.85, defaultCostPerKg: 1.15 },
            { id: 'fer4', name: 'Rete Elettrosaldata B450C', specificGravity: 7.85, defaultCostPerKg: 1.35 },
            { id: 'fer5', name: 'Staffame Sagomato (Gabbie)', specificGravity: 7.85, defaultCostPerKg: 1.55 },
            // --- ISOLANTI E INERTI ---
            { id: 'iso1', name: 'Polistirene Espanso (EPS 100)', specificGravity: 0.02, defaultCostPerKg: 6.50 },

            { id: 'ine1', name: 'Ghiaietto Lavato (Finitura Pannelli)', specificGravity: 1.60, defaultCostPerKg: 0.05 },
            { id: 'ine2', name: 'Sabbia di Fiume', specificGravity: 1.50, defaultCostPerKg: 0.03 },
            // --- CONSUMABILI E ACCESSORI CHIMICI ---
            { id: 'chim1', name: 'Disarmante Ecologico', specificGravity: 0.90, defaultCostPerKg: 2.50 },

        const INITIAL_MACHINES = [

            // --- PRECOMPRESSIONE ---

            // --- MATURAZIONE & FINITURA ---
            { id: 'cur1', name: 'Impianto Vapore (Maturazione Accel.)', costPerHour: 75.00 },
            { id: 'cur2', name: 'Elicottero Lisciatura CLS', costPerHour: 45.00 },
            { id: 'cur3', name: 'Taglierina Disco Diamantato (Alveolari)', costPerHour: 110.00 },
            { id: 'cur4', name: 'Lavaggio Pannelli (Ghiaietto a vista)', costPerHour: 50.00 },
            // --- MOVIMENTAZIONE ---
            { id: 'mov1', name: 'Carroponte 40Ton (Scassero)', costPerHour: 95.00 },
            { id: 'mov2', name: 'Carrello Elevatore 16Ton (Piazzale)', costPerHour: 110.00 },
            { id: 'mov3', name: 'Gru a Cavalletto (Stoccaggio)', costPerHour: 80.00 },
            { id: 'mov4', name: 'Carrellone Semovente (Trasporto Interno)', costPerHour: 130.00 },
            // --- MANODOPERA ---
            { id: 'hr1', name: 'Caposquadra Prefabbricazione', costPerHour: 45.00 },
            { id: 'hr2', name: 'Carpentiere (Casseri complessi)', costPerHour: 38.00 },
            { id: 'hr3', name: 'Ferraiolo (Assemblaggio gabbie)', costPerHour: 35.00 },
            { id: 'hr4', name: 'Operatore Gru/Carroponte', costPerHour: 40.00 },
            { id: 'hr5', name: 'Tecnico Lab. Qualità (Prove Cubetti)', costPerHour: 50.00 },
        ];

        const INITIAL_CATEGORIES = [
            { id: 'cat1', name: '1. MANUFATTI (Produzione)', items: [] },
            { id: 'cat2', name: '2. OPERE ACCESSORIE', items: [] },
            { id: 'cat3', name: '3. TRASPORTI E LOGISTICA', items: [] },
            { id: 'cat4', name: '4. MONTAGGI E INSTALLAZIONE', items: [] },
            { id: 'cat5', name: '5. PROGETTAZIONE E INGEGNERIA', items: [] },
            { id: 'cat6', name: '6. POLIZZE E ASSICURAZIONI', items: [] },
            { id: 'cat7', name: '7. OPERE COMPLEMENTARI', items: [] },
            { id: 'cat8', name: '8. VARIE E ALTRI ONERI', items: [] },
        ];

        const UNITS = [
            'cad', 'kg', 'm', 'mq', 'mc', 'h', 'a corpo', 'set', 'kit', 'viaggio', 'lotto', 'sett'
        ];

        // --- COMPONENTS ---

        // UI: Input
        const Input = ({ label, suffix, className, ...props }) => {
            return (
                <div className="flex flex-col gap-1 w-full">
                {label && <span className="text-xs text-gray-400 font-medium tracking-wide uppercase">{label}</span>}
                <div className="relative flex items-center">
                    <input
                    className={`w-full bg-[#333333] border border-gray-600 rounded px-3 py-2 text-sm text-white focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 transition-colors ${className || ''}`}
                    {...props}
                    />
                    {suffix && (
                    <span className="absolute right-3 text-xs text-gray-500 pointer-events-none">
                        {suffix}
                    </span>
                    )}
                </div>
                </div>
            );
        };

        // UI: Select (Native for better table support)
        const Select = ({ label, children, className, ...props }) => {
            return (
                <div className="flex flex-col gap-1 w-full">
                {label && <span className="text-xs text-gray-400 font-medium tracking-wide uppercase">{label}</span>}
                <select
                    className={`w-full bg-[#333333] border border-gray-600 rounded px-3 py-2 text-sm text-white focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 transition-colors ${className || ''}`}
                    {...props}
                >
                    {children}
                </select>
                </div>
            );
        };

        // Component: DatabaseConfig
        const DatabaseConfig = ({ materials, machines, setMaterials, setMachines }) => {
            const updateMaterial = (id, field, value) => {
                setMaterials(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            };
            const updateMachine = (id, field, value) => {
                setMachines(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            };

            return (
                <div className="p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8 animate-fade-in">
                    {/* Materials */}
                    <div className="bg-[#252525] border border-gray-700 rounded-lg p-4 md:p-5 shadow-lg">
                        <div className="flex items-center gap-2 mb-6 border-b border-gray-700 pb-2">
                            <Database className="text-cyan-400 w-5 h-5" />
                            <h2 className="text-lg font-bold text-gray-100">Database Materiali</h2>
                        </div>
                        <div className="space-y-4">
                            {materials.map(mat => (
                                <div key={mat.id} className="grid grid-cols-1 sm:grid-cols-12 gap-3 sm:gap-2 items-end bg-[#2a2a2a] p-3 rounded border border-gray-800">
                                    <div className="sm:col-span-6">
                                        <Input label="Nome Materiale" value={mat.name} onChange={(e) => updateMaterial(mat.id, 'name', e.target.value)} />
                                    </div>
                                    <div className="sm:col-span-3">
                                        <Input label="Peso Spec." type="number" step="0.01" suffix="kg/dm³" value={mat.specificGravity} onChange={(e) => updateMaterial(mat.id, 'specificGravity', parseFloat(e.target.value))} />
                                    </div>
                                    <div className="sm:col-span-3">
                                        <Input label="Costo Base" type="number" step="0.01" suffix="€/kg" value={mat.defaultCostPerKg} onChange={(e) => updateMaterial(mat.id, 'defaultCostPerKg', parseFloat(e.target.value))} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {/* Machines */}
                    <div className="bg-[#252525] border border-gray-700 rounded-lg p-4 md:p-5 shadow-lg">
                        <div className="flex items-center gap-2 mb-6 border-b border-gray-700 pb-2">
                            <Settings className="text-lime-400 w-5 h-5" />
                            <h2 className="text-lg font-bold text-gray-100">Centri di Lavoro & Risorse</h2>
                        </div>
                        <div className="space-y-4">
                            {machines.map(mac => (
                                <div key={mac.id} className="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end bg-[#2a2a2a] p-3 rounded border border-gray-800">
                                    <div className="sm:col-span-8">
                                        <Input label="Risorsa" value={mac.name} onChange={(e) => updateMachine(mac.id, 'name', e.target.value)} />
                                    </div>
                                    <div className="sm:col-span-4">
                                        <Input label="Costo Orario" type="number" step="0.01" suffix="€/h" value={mac.costPerHour} onChange={(e) => updateMachine(mac.id, 'costPerHour', parseFloat(e.target.value))} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Component: ProductionCalculator
        const ProductionCalculator = ({ materials, machines, categories, onAddToQuote }) => {
            const [calc, setCalc] = useState({
                materialId: materials[0]?.id || '',
                isManual: false,
                manualName: 'Nuovo Materiale',
                manualDensity: 7.85,
                manualUnit: 'kg',
                shape: 'SHEET',
                dimensions: { L: 1000, W: 500, H: 10, D: 5, D_inner: 40 },
                wastePercentage: 5,
                materialCostPerKg: materials[0]?.defaultCostPerKg || 0,
                batchSize: 10,
                oee: 85,
                routing: [],
                additionalMaterials: [],
                consumablesCost: 2.50,
                treatmentsCost: 1.50,
                factoryOverheadPercentage: 15
            });

            // State for selecting which components to include in the quote
            const [composition, setComposition] = useState({
                raw: true,
                bom: true,
                routing: true,
                overheads: true
            });

            const [explodeQuote, setExplodeQuote] = useState(false);

            const [results, setResults] = useState({
                weightPerPiece: 0,
                mainMaterialCost: 0,
                additionalMaterialCostTotal: 0,
                transformationCostTotal: 0,
                industrialCostUnit: 0,
                activeCost: 0 // The cost based on checked composition
            });

            const [targetCategoryId, setTargetCategoryId] = useState('');
            const [quoteDescription, setQuoteDescription] = useState('');

            useEffect(() => {
                if (categories.length > 0 && !targetCategoryId) {
                    setTargetCategoryId(categories[0].id);
                }
            }, [categories, targetCategoryId]);

            useEffect(() => {
                if (!calc.isManual && materials.length > 0 && !calc.materialId) {
                    setCalc(prev => ({
                        ...prev,
                        materialId: materials[0].id,
                        materialCostPerKg: materials[0].defaultCostPerKg
                    }));
                }
            }, [materials, calc.isManual]);

            const handleDimensionChange = (key, val) => {
                setCalc(prev => ({ ...prev, dimensions: { ...prev.dimensions, [key]: parseFloat(val) || 0 } }));
            };

            const toggleComposition = (key) => {
                setComposition(prev => ({...prev, [key]: !prev[key]}));
            };

            const addRoutingStep = () => {
                const machine = machines[0];
                const newStep = {
                    id: uuidv4(),
                    operationName: 'Nuova Fase',
                    machineId: machine?.id || '',
                    setupTime: 30,
                    cycleTime: 5,
                    laborCostPerHour: 30
                };
                setCalc(prev => ({ ...prev, routing: [...prev.routing, newStep] }));
            };

            const updateRoutingStep = (id, field, value) => {
                setCalc(prev => ({
                    ...prev,
                    routing: prev.routing.map(step => step.id === id ? { ...step, [field]: value } : step)
                }));
            };

            const removeRoutingStep = (id) => {
                setCalc(prev => ({ ...prev, routing: prev.routing.filter(r => r.id !== id) }));
            };

            const addAdditionalMaterial = () => {
                const defaultMat = materials[0];
                const newMat = {
                    id: uuidv4(),
                    materialId: defaultMat?.id || '',
                    quantity: 1,
                    costPerUnit: defaultMat?.defaultCostPerKg || 0
                };
                setCalc(prev => ({ ...prev, additionalMaterials: [...prev.additionalMaterials, newMat] }));
            };

            const updateAdditionalMaterial = (id, field, value) => {
                setCalc(prev => ({
                    ...prev,
                    additionalMaterials: prev.additionalMaterials.map(item => {
                        if (item.id !== id) return item;
                        if (field === 'materialId') {
                            const selectedMat = materials.find(m => m.id === value);
                            return { ...item, materialId: value, costPerUnit: selectedMat?.defaultCostPerKg || 0 };
                        }
                        return { ...item, [field]: value };
                    })
                }));
            };

            const removeAdditionalMaterial = (id) => {
                setCalc(prev => ({ ...prev, additionalMaterials: prev.additionalMaterials.filter(m => m.id !== id) }));
            };

            const resetCalculation = () => {
                setCalc({
                    materialId: materials[0]?.id || '',
                    isManual: false,
                    manualName: 'Nuovo Materiale',
                    manualDensity: 7.85,
                    manualUnit: 'kg',
                    shape: 'SHEET',
                    dimensions: { L: 0, W: 0, H: 0, D: 0, D_inner: 0 },
                    wastePercentage: 0,
                    materialCostPerKg: materials[0]?.defaultCostPerKg || 0,
                    batchSize: 0,
                    oee: 0,
                    routing: [],
                    additionalMaterials: [],
                    consumablesCost: 0,
                    treatmentsCost: 0,
                    factoryOverheadPercentage: 0
                });
                setResults({
                    weightPerPiece: 0,
                    mainMaterialCost: 0,
                    additionalMaterialCostTotal: 0,
                    transformationCostTotal: 0,
                    industrialCostUnit: 0,
                    activeCost: 0
                });
                setQuoteDescription('');
                // Reset also composition to all true
                setComposition({ raw: true, bom: true, routing: true, overheads: true });
            };

            useEffect(() => {
                const material = materials.find(m => m.id === calc.materialId);
                let volume = 0; // dm3
                const { L, W, H, D, D_inner } = calc.dimensions;
                const L_dm = L / 100;
                const W_dm = W / 100;
                const H_dm = H / 100;
                const D_dm = D / 100;
                const D_inner_dm = D_inner / 100;

                let dimStr = '';

                switch (calc.shape) {
                    case 'SHEET':
                        volume = L_dm * W_dm * H_dm;
                        dimStr = `${L}x${W}x${H}mm`;
                        break;
                    case 'BAR':
                        volume = Math.PI * Math.pow(D_dm / 2, 2) * L_dm;
                        dimStr = `Ø${D} L=${L}mm`;
                        break;
                    case 'TUBE':
                        volume = Math.PI * (Math.pow(D_dm / 2, 2) - Math.pow(D_inner_dm / 2, 2)) * L_dm;
                        dimStr = `Ø${D}/${D_inner} L=${L}mm`;
                        break;
                    case 'PROFILE':
                        volume = (L_dm * W_dm * H_dm) * 0.5; // Approximation
                        dimStr = `${L}x${W}x${H}mm (Prof)`;
                        break;
                    case 'TUBE_RECT': // W=Width, H=Height, D=Thickness
                        volume = (W_dm * H_dm - (W_dm - 2*D_dm) * (H_dm - 2*D_dm)) * L_dm;
                        dimStr = `${W}x${H}x${D}mm (Tubo Rett)`;
                        break;
                    case 'TUBE_SQUARE': // W=Side, D=Thickness
                        volume = (Math.pow(W_dm, 2) - Math.pow(W_dm - 2*D_dm, 2)) * L_dm;
                        dimStr = `${W}x${W}x${D}mm (Tubo Q.)`;
                        break;
                    case 'HEXAGON':
                        volume = 0.866 * Math.pow(D_dm, 2) * L_dm;
                        dimStr = `Hex ${D}mm L=${L}mm`;
                        break;
                    case 'ANGLE':
                        volume = (W_dm * D_dm + (H_dm - D_dm) * D_dm) * L_dm;
                        dimStr = `L ${W}x${H}x${D}mm`;
                        break;
                    case 'BEAM':
                        volume = (2 * W_dm * D_inner_dm + (H_dm - 2*D_inner_dm) * D_dm) * L_dm;
                        dimStr = `Trave H${H}x${W}`;
                        break;
                }
                
                // Ensure volume is not negative
                volume = Math.max(0, volume);

                const specificGravity = calc.isManual ? calc.manualDensity : (material ? material.specificGravity : 0);
                const grossWeight = volume * specificGravity * (1 + calc.wastePercentage / 100);
                
                // 1b. Material Cost Calculation handling Units
                let mainMatCost = 0;
                const unitPrice = calc.materialCostPerKg; // This input acts as generic price in manual mode

                if (calc.isManual) {
                   switch(calc.manualUnit) {
                      case 'kg':
                         mainMatCost = grossWeight * unitPrice;
                         break;
                      case 'm':
                         mainMatCost = (L / 1000) * unitPrice;
                         break;
                      case 'mq':
                         // Simplified surface area (Top face or largest face)
                         const area = (L/1000) * (calc.dimensions.W > 0 ? calc.dimensions.W/1000 : calc.dimensions.D/1000); 
                         mainMatCost = area * unitPrice;
                         break;
                      case 'cad':
                      case 'set':
                      case 'kit':
                         mainMatCost = 1 * unitPrice;
                         break;
                      default:
                         mainMatCost = grossWeight * unitPrice; // Fallback to weight
                   }
                } else {
                   // Standard DB mode is always €/kg
                   mainMatCost = grossWeight * unitPrice;
                }

                const additionalMatCost = calc.additionalMaterials.reduce((acc, item) => acc + (item.quantity * item.costPerUnit), 0);

                let totalTransformation = 0;
                calc.routing.forEach(step => {
                    const machine = machines.find(m => m.id === step.machineId);
                    const machCost = machine ? machine.costPerHour : 0;
                    const hourlyRate = machCost + step.laborCostPerHour;
                    const hoursPerPiece = (step.cycleTime / 60) + (step.setupTime / (calc.batchSize || 1) / 60);
                    const efficiency = (calc.oee || 100) / 100;
                    totalTransformation += (hourlyRate * hoursPerPiece) / efficiency;
                });

                const indirectCosts = calc.consumablesCost + (calc.treatmentsCost * grossWeight);
                const baseCost = mainMatCost + additionalMatCost + totalTransformation + indirectCosts;
                const overheadVal = baseCost * (calc.factoryOverheadPercentage / 100);
                const industrialCost = baseCost + overheadVal;

                // Calculate Active Cost based on Composition
                let active = 0;
                if (composition.raw) active += mainMatCost;
                if (composition.bom) active += additionalMatCost;
                if (composition.routing) active += totalTransformation;
                if (composition.overheads) active += (indirectCosts + overheadVal);

                setResults({
                    weightPerPiece: grossWeight,
                    mainMaterialCost: mainMatCost,
                    additionalMaterialCostTotal: additionalMatCost,
                    transformationCostTotal: totalTransformation,
                    industrialCostUnit: industrialCost,
                    activeCost: active
                });

                // Auto-generate description
                const matName = calc.isManual ? calc.manualName : (material ? material.name : 'Materiale');
                const shapeMap = {
                   'SHEET': 'Lamiera', 'BAR': 'Barra', 'TUBE': 'Tubo', 'PROFILE': 'Profilo',
                   'TUBE_RECT': 'Tubo Rett.', 'TUBE_SQUARE': 'Tubo Q.', 'HEXAGON': 'Esagonale',
                   'ANGLE': 'Angolare', 'BEAM': 'Trave'
                };
                const shapeName = shapeMap[calc.shape] || calc.shape;
                
                let descPrefix = "Manufatto Completo";
                if (composition.routing && !composition.raw && !composition.bom) descPrefix = "Lavorazione conto terzi";
                else if (!composition.routing && (composition.raw || composition.bom)) descPrefix = "Fornitura Materiali";
                else if (!composition.raw && composition.bom) descPrefix = "Kit Accessori";
                
                setQuoteDescription(`${descPrefix}: ${matName} (${shapeName}) - ${dimStr}`);

            }, [calc, materials, machines, composition]);

            const handleTransferToQuote = () => {
                if (!targetCategoryId) return;
                
                const itemsToAdd = [];
                const batchSize = calc.batchSize || 1;
                const codePrefix = `PROD-${new Date().getFullYear()}-${Math.floor(Math.random()*1000)}`;

                if (explodeQuote) {
                  if (composition.raw) {
                     const matName = calc.isManual ? calc.manualName : materials.find(m => m.id === calc.materialId)?.name;
                     itemsToAdd.push({
                        id: uuidv4(),
                        categoryId: targetCategoryId,
                        code: `${codePrefix}-RAW`,
                        description: `Materia Prima: ${matName} - ${calc.shape}`,
                        unit: 'cad',
                        quantity: batchSize,
                        unitCost: parseFloat(results.mainMaterialCost.toFixed(2)),
                        markupPercentage: 20,
                        discountPercentage: 0
                     });
                  }
                  if (composition.bom) {
                     calc.additionalMaterials.forEach((item, idx) => {
                        const matParams = materials.find(m => m.id === item.materialId);
                        itemsToAdd.push({
                           id: uuidv4(),
                           categoryId: targetCategoryId,
                           code: `${codePrefix}-BOM-${idx+1}`,
                           description: `Componente: ${matParams?.name || 'Materiale'}`,
                           unit: 'cad',
                           quantity: parseFloat((item.quantity * batchSize).toFixed(2)),
                           unitCost: item.costPerUnit,
                           markupPercentage: 20,
                           discountPercentage: 0
                        });
                     });
                  }
                  if (composition.routing) {
                     itemsToAdd.push({
                        id: uuidv4(),
                        categoryId: targetCategoryId,
                        code: `${codePrefix}-LAB`,
                        description: `Servizio di Lavorazione e Trasformazione`,
                        unit: 'cad',
                        quantity: batchSize,
                        unitCost: parseFloat(results.transformationCostTotal.toFixed(2)),
                        markupPercentage: 20,
                        discountPercentage: 0
                     });
                  }
                  if (composition.overheads) {
                     const overheadCost = results.industrialCostUnit - results.mainMaterialCost - results.additionalMaterialCostTotal - results.transformationCostTotal;
                     itemsToAdd.push({
                        id: uuidv4(),
                        categoryId: targetCategoryId,
                        code: `${codePrefix}-OVH`,
                        description: `Oneri Accessori e Generali`,
                        unit: 'cad',
                        quantity: batchSize,
                        unitCost: parseFloat(overheadCost.toFixed(2)),
                        markupPercentage: 20,
                        discountPercentage: 0
                     });
                  }

                } else {
                    const newItem = {
                        id: uuidv4(),
                        categoryId: targetCategoryId,
                        code: codePrefix,
                        description: quoteDescription || `Manufatto ${calc.shape} - Lotto ${calc.batchSize}pz`,
                        unit: 'cad',
                        quantity: calc.batchSize || 1,
                        unitCost: parseFloat(results.activeCost.toFixed(2)),
                        markupPercentage: 20,
                        discountPercentage: 0
                    };
                    itemsToAdd.push(newItem);
                }
                
                onAddToQuote(itemsToAdd);
            };

            const renderDimensionInputs = () => {
                 switch (calc.shape) {
                    case 'SHEET':
                       return (
                          <>
                             <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                             <Input placeholder="W" label="Larghezza" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                             <Input placeholder="H" label="Spessore" value={calc.dimensions.H} onChange={e => handleDimensionChange('H', e.target.value)} />
                          </>
                       );
                    case 'BAR':
                       return (
                          <>
                             <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                             <Input placeholder="Ø" label="Diametro" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                          </>
                       );
                    case 'TUBE':
                       return (
                          <>
                             <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                             <Input placeholder="Ø Ext" label="Diametro Est" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                             <Input placeholder="Ø Int" label="Diametro Int" value={calc.dimensions.D_inner} onChange={e => handleDimensionChange('D_inner', e.target.value)} />
                          </>
                       );
                     case 'TUBE_RECT':
                        return (
                           <>
                              <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                              <Input placeholder="W" label="Lato A (Larg)" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                              <Input placeholder="H" label="Lato B (Alt)" value={calc.dimensions.H} onChange={e => handleDimensionChange('H', e.target.value)} />
                              <Input placeholder="Sp" label="Spessore" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                           </>
                        );
                     case 'TUBE_SQUARE':
                        return (
                           <>
                              <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                              <Input placeholder="Lato" label="Lato" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                              <Input placeholder="Sp" label="Spessore" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                           </>
                        );
                     case 'HEXAGON':
                        return (
                           <>
                              <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                              <Input placeholder="Ch" label="Chiave (mm)" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                           </>
                        );
                     case 'ANGLE':
                        return (
                           <>
                              <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                              <Input placeholder="W" label="Lato A" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                              <Input placeholder="H" label="Lato B" value={calc.dimensions.H} onChange={e => handleDimensionChange('H', e.target.value)} />
                              <Input placeholder="Sp" label="Spessore" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                           </>
                        );
                     case 'BEAM':
                        return (
                           <>
                              <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                              <Input placeholder="H" label="Altezza (H)" value={calc.dimensions.H} onChange={e => handleDimensionChange('H', e.target.value)} />
                              <Input placeholder="W" label="Larghezza (B)" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                              <Input placeholder="Tw" label="Spess. Anima" value={calc.dimensions.D} onChange={e => handleDimensionChange('D', e.target.value)} />
                              <Input placeholder="Tf" label="Spess. Ala" value={calc.dimensions.D_inner} onChange={e => handleDimensionChange('D_inner', e.target.value)} />
                           </>
                        );
                    default: 
                       return (
                          <>
                             <Input placeholder="L" label="Lunghezza" value={calc.dimensions.L} onChange={e => handleDimensionChange('L', e.target.value)} />
                             <Input placeholder="W" label="Larghezza" value={calc.dimensions.W} onChange={e => handleDimensionChange('W', e.target.value)} />
                             <Input placeholder="H" label="Altezza" value={calc.dimensions.H} onChange={e => handleDimensionChange('H', e.target.value)} />
                          </>
                       );
                 }
            };

            return (
                <div className="p-4 md:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6 animate-fade-in">
                    {/* COL 1: PARAMS */}
                    <div className="xl:col-span-4 space-y-6">
                        <div className="bg-[#252525] border border-gray-700 rounded-lg p-5 shadow-lg">
                            <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                                <h3 className="text-cyan-400 font-bold uppercase tracking-wider flex items-center gap-2">
                                <Cuboid size={20} /> 1. Geometria Grezzo
                                </h3>
                                <button 
                                    onClick={() => setCalc(prev => ({...prev, isManual: !prev.isManual}))}
                                    className={`text-xs px-2 py-1 rounded border transition-colors flex items-center gap-1 ${calc.isManual ? 'bg-orange-900/40 border-orange-600 text-orange-300' : 'bg-gray-800 border-gray-600 text-gray-400'}`}
                                >
                                    <RefreshCw size={12} /> {calc.isManual ? 'Mod. Manuale' : 'Da Database'}
                                </button>
                            </div>
                            <div className="space-y-4">
                                {calc.isManual ? (
                                    <div className="p-3 bg-orange-900/10 border border-orange-900/30 rounded grid grid-cols-2 gap-3 animate-fade-in">
                                       <div className="col-span-2">
                                          <Input label="Nome Materiale" value={calc.manualName} onChange={(e) => setCalc(prev => ({...prev, manualName: e.target.value}))} />
                                       </div>
                                       <Input label="Peso Spec. (kg/dm³)" type="number" step="0.01" value={calc.manualDensity} onChange={(e) => setCalc(prev => ({...prev, manualDensity: parseFloat(e.target.value)}))} />
                                       <Input label="Costo Unitario" type="number" step="0.01" value={calc.materialCostPerKg} onChange={(e) => setCalc(prev => ({...prev, materialCostPerKg: parseFloat(e.target.value)}))} />
                                       <div className="col-span-2">
                                          <Select label="Unità di Misura Costo" value={calc.manualUnit} onChange={(e) => setCalc(prev => ({...prev, manualUnit: e.target.value}))}>
                                             {UNITS.map(u => <option key={u} value={u} className="bg-[#333]">€ / {u}</option>)}
                                          </Select>
                                       </div>
                                    </div>
                                ) : (
                                    <Select label="Materiale Principale" value={calc.materialId} onChange={(e) => {
                                        const m = materials.find(x => x.id === e.target.value);
                                        setCalc(prev => ({...prev, materialId: e.target.value, materialCostPerKg: m?.defaultCostPerKg || 0}))
                                    }}>
                                        {materials.map(m => <option key={m.id} value={m.id} className="bg-[#333] text-white">{m.name}</option>)}
                                    </Select>
                                )}
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <Select label="Forma Geometrica" value={calc.shape} onChange={(e) => setCalc(prev => ({...prev, shape: e.target.value}))}>
                                        <option value="SHEET" className="bg-[#333] text-white">Lamiera / Piatto</option>
                                        <option value="BAR" className="bg-[#333] text-white">Barra Tonda</option>
                                        <option value="TUBE" className="bg-[#333] text-white">Tubo Tondo</option>
                                        <option value="TUBE_RECT" className="bg-[#333] text-white">Tubo Rettangolare</option>
                                        <option value="TUBE_SQUARE" className="bg-[#333] text-white">Tubo Quadro</option>
                                        <option value="HEXAGON" className="bg-[#333] text-white">Esagonale Pieno</option>
                                        <option value="ANGLE" className="bg-[#333] text-white">Profilo Angolare (L)</option>
                                        <option value="BEAM" className="bg-[#333] text-white">Trave (H/I)</option>
                                        <option value="PROFILE" className="bg-[#333] text-white">Blocco Generico</option>
                                    </Select>
                                    
                                    {!calc.isManual && (
                                        <Input label="Costo M.P." type="number" suffix="€/kg" value={calc.materialCostPerKg} onChange={(e) => setCalc(prev => ({...prev, materialCostPerKg: parseFloat(e.target.value)}))} />
                                    )}
                                </div>
                                
                                <div className="p-4 bg-[#333] rounded border border-gray-600 grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <span className="col-span-2 sm:col-span-3 text-xs text-gray-400 font-bold flex items-center gap-1">DIMENSIONI (mm)</span>
                                    {renderDimensionInputs()}
                                </div>
                                <div className="flex justify-between items-center px-2">
                                    <span className="text-gray-400 text-sm">Peso Teorico (+Sfrido):</span>
                                    <span className="text-xl font-mono text-cyan-300">{results.weightPerPiece.toFixed(2)} kg</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#252525] border border-gray-700 rounded-lg p-5 shadow-lg">
                            <h3 className="text-gray-300 font-bold mb-4 uppercase tracking-wider flex items-center gap-2 border-b border-gray-700 pb-2">
                                <Settings2 size={20} /> Parametri Lotto & Indiretti
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Input label="Q.tà Lotto" type="number" value={calc.batchSize} onChange={(e) => setCalc(prev => ({...prev, batchSize: parseFloat(e.target.value)}))} />
                                <Input label="Efficienza (OEE %)" type="number" value={calc.oee} onChange={(e) => setCalc(prev => ({...prev, oee: parseFloat(e.target.value)}))} />
                                <Input label="Sfrido Mat. (%)" type="number" value={calc.wastePercentage} onChange={(e) => setCalc(prev => ({...prev, wastePercentage: parseFloat(e.target.value)}))} />
                                <Input label="Overhead (%)" type="number" value={calc.factoryOverheadPercentage} onChange={(e) => setCalc(prev => ({...prev, factoryOverheadPercentage: parseFloat(e.target.value)}))} />
                            </div>
                            <div className="mt-4 pt-4 border-t border-gray-700 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Input label="Consumabili (€/pz)" type="number" value={calc.consumablesCost} onChange={(e) => setCalc(prev => ({...prev, consumablesCost: parseFloat(e.target.value)}))} />
                                <Input label="Trattamenti (€/kg)" type="number" value={calc.treatmentsCost} onChange={(e) => setCalc(prev => ({...prev, treatmentsCost: parseFloat(e.target.value)}))} />
                            </div>
                        </div>
                    </div>

                    {/* COL 2: BOM & ROUTING */}
                    <div className="xl:col-span-8 space-y-6">
                        {/* BOM */}
                        <div className="bg-[#252525] border border-gray-700 rounded-lg p-5 shadow-lg">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                <h3 className="text-orange-400 font-bold uppercase tracking-wider flex items-center gap-2">
                                    <ShoppingCart size={20} /> Distinta Base (B.O.M.)
                                </h3>
                                <button onClick={addAdditionalMaterial} className="bg-[#333] hover:bg-gray-600 text-white px-3 py-1 rounded text-xs flex items-center gap-1 border border-gray-500">
                                    <Plus size={14} /> Aggiungi Componente
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[600px]">
                                    <thead>
                                        <tr className="text-xs text-gray-500 border-b border-gray-700">
                                            <th className="py-2 pl-2">Materiale / Componente</th>
                                            <th className="py-2 w-24 text-center">Q.tà</th>
                                            <th className="py-2 w-24 text-center">Costo Unit.</th>
                                            <th className="py-2 w-24 text-right pr-2">Totale</th>
                                            <th className="w-8"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {calc.additionalMaterials.length === 0 ? (
                                            <tr><td colSpan={5} className="py-4 text-center text-gray-600 italic">Nessun materiale aggiuntivo inserito.</td></tr>
                                        ) : (
                                            calc.additionalMaterials.map(item => (
                                                <tr key={item.id} className="border-b border-gray-800 hover:bg-[#2f2f2f]">
                                                    <td className="py-2 pl-2">
                                                        <select className="w-full bg-[#333] border border-gray-600 rounded px-2 py-1 text-white focus:outline-none focus:border-cyan-500" value={item.materialId} onChange={(e) => updateAdditionalMaterial(item.id, 'materialId', e.target.value)}>
                                                            <option value="" className="bg-[#333] text-white">-- Seleziona Materiale --</option>
                                                            {materials.map(m => <option key={m.id} value={m.id} className="bg-[#333] text-white">{m.name}</option>)}
                                                        </select>
                                                    </td>
                                                    <td className="py-2 px-1"><input type="number" className="w-full bg-[#333] border border-gray-600 rounded px-1 py-1 text-center text-white" value={item.quantity} onChange={(e) => updateAdditionalMaterial(item.id, 'quantity', parseFloat(e.target.value))} /></td>
                                                    <td className="py-2 px-1"><input type="number" className="w-full bg-[#333] border border-gray-600 rounded px-1 py-1 text-center text-white" value={item.costPerUnit} onChange={(e) => updateAdditionalMaterial(item.id, 'costPerUnit', parseFloat(e.target.value))} /></td>
                                                    <td className="py-2 text-right pr-2 font-mono text-orange-300">€ {(item.quantity * item.costPerUnit).toFixed(2)}</td>
                                                    <td className="py-2 text-center"><button onClick={() => removeAdditionalMaterial(item.id)} className="text-gray-500 hover:text-red-500"><Trash2 size={14} /></button></td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-2 text-right text-xs text-gray-400">Subtotale B.O.M: <span className="text-orange-400 font-bold">€ {results.additionalMaterialCostTotal.toFixed(2)}</span></div>
                        </div>

                        {/* Routing */}
                        <div className="bg-[#252525] border border-gray-700 rounded-lg p-5 shadow-lg">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                <h3 className="text-lime-400 font-bold uppercase tracking-wider flex items-center gap-2">
                                    <Layers size={20} /> Ciclo di Lavorazione
                                </h3>
                                <button onClick={addRoutingStep} className="bg-[#333] hover:bg-gray-600 text-white px-3 py-1 rounded text-xs flex items-center gap-1 border border-gray-500">
                                    <Plus size={14} /> Aggiungi Fase
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[700px]">
                                    <thead>
                                        <tr className="text-xs text-gray-500 border-b border-gray-700">
                                            <th className="py-2 pl-2">Descrizione Fase</th>
                                            <th className="py-2">Centro di Lavoro</th>
                                            <th className="py-2 w-20 text-center">Setup (m)</th>
                                            <th className="py-2 w-20 text-center">Ciclo (m)</th>
                                            <th className="py-2 w-20 text-center">Costo Op.</th>
                                            <th className="w-8"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {calc.routing.length === 0 ? (
                                            <tr><td colSpan={6} className="py-4 text-center text-gray-600 italic">Nessuna fase di lavorazione inserita.</td></tr>
                                        ) : (
                                            calc.routing.map(step => (
                                                <tr key={step.id} className="border-b border-gray-800 hover:bg-[#2f2f2f]">
                                                    <td className="py-2 pl-2"><input className="w-full bg-transparent border-b border-transparent focus:border-cyan-500 outline-none text-gray-300" value={step.operationName} onChange={e => updateRoutingStep(step.id, 'operationName', e.target.value)} /></td>
                                                    <td className="py-2 pr-2">
                                                        <select className="w-full bg-[#333] border border-gray-600 rounded px-2 py-1 text-white focus:outline-none focus:border-cyan-500 text-xs" value={step.machineId} onChange={(e) => updateRoutingStep(step.id, 'machineId', e.target.value)}>
                                                            <option value="" className="bg-[#333] text-white">-- Seleziona Macchina --</option>
                                                            {machines.map(m => <option key={m.id} value={m.id} className="bg-[#333] text-white">{m.name} (€{m.costPerHour}/h)</option>)}
                                                        </select>
                                                    </td>
                                                    <td className="py-2 px-1"><input type="number" className="w-full bg-[#333] rounded text-center text-white text-xs py-1" value={step.setupTime} onChange={e => updateRoutingStep(step.id, 'setupTime', parseFloat(e.target.value))} /></td>
                                                    <td className="py-2 px-1"><input type="number" className="w-full bg-[#333] rounded text-center text-white text-xs py-1" value={step.cycleTime} onChange={e => updateRoutingStep(step.id, 'cycleTime', parseFloat(e.target.value))} /></td>
                                                    <td className="py-2 px-1"><input type="number" className="w-full bg-[#333] rounded text-center text-white text-xs py-1" value={step.laborCostPerHour} onChange={e => updateRoutingStep(step.id, 'laborCostPerHour', parseFloat(e.target.value))} /></td>
                                                    <td className="py-2 text-center"><button onClick={() => removeRoutingStep(step.id)} className="text-gray-500 hover:text-red-500"><Trash2 size={14} /></button></td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-2 text-right text-xs text-gray-400">Subtotale Lavorazioni: <span className="text-lime-400 font-bold">€ {results.transformationCostTotal.toFixed(2)}</span></div>
                        </div>

                        {/* TOTALS & ACTIONS */}
                        <div className="bg-gradient-to-r from-gray-800 to-[#252525] border border-gray-600 rounded-lg p-5 shadow-2xl flex flex-col gap-6">
                            
                            {/* Composition Selection */}
                            <div className="border-b border-gray-600 pb-4">
                                <span className="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-2">Composizione Costo (Seleziona cosa includere)</span>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <div onClick={() => toggleComposition('raw')} className={`cursor-pointer px-3 py-2 rounded border flex items-center justify-between transition-colors ${composition.raw ? 'bg-cyan-900/20 border-cyan-700 text-cyan-100' : 'bg-[#333] border-gray-600 text-gray-500'}`}>
                                        <div className="flex items-center gap-2"><div className={`w-4 h-4 rounded border flex items-center justify-center ${composition.raw ? 'bg-cyan-500 border-cyan-500' : 'border-gray-500'}`}>{composition.raw && <CheckSquare size={12} className="text-white" />}</div> <span className="text-xs font-bold">Geometria</span></div>
                                        <span className="text-xs font-mono">€{results.mainMaterialCost.toFixed(0)}</span>
                                    </div>
                                    <div onClick={() => toggleComposition('bom')} className={`cursor-pointer px-3 py-2 rounded border flex items-center justify-between transition-colors ${composition.bom ? 'bg-orange-900/20 border-orange-700 text-orange-100' : 'bg-[#333] border-gray-600 text-gray-500'}`}>
                                        <div className="flex items-center gap-2"><div className={`w-4 h-4 rounded border flex items-center justify-center ${composition.bom ? 'bg-orange-500 border-orange-500' : 'border-gray-500'}`}>{composition.bom && <CheckSquare size={12} className="text-white" />}</div> <span className="text-xs font-bold">B.O.M.</span></div>
                                        <span className="text-xs font-mono">€{results.additionalMaterialCostTotal.toFixed(0)}</span>
                                    </div>
                                    <div onClick={() => toggleComposition('routing')} className={`cursor-pointer px-3 py-2 rounded border flex items-center justify-between transition-colors ${composition.routing ? 'bg-lime-900/20 border-lime-700 text-lime-100' : 'bg-[#333] border-gray-600 text-gray-500'}`}>
                                        <div className="flex items-center gap-2"><div className={`w-4 h-4 rounded border flex items-center justify-center ${composition.routing ? 'bg-lime-500 border-lime-500' : 'border-gray-500'}`}>{composition.routing && <CheckSquare size={12} className="text-white" />}</div> <span className="text-xs font-bold">Lavorazioni</span></div>
                                        <span className="text-xs font-mono">€{results.transformationCostTotal.toFixed(0)}</span>
                                    </div>
                                    <div onClick={() => toggleComposition('overheads')} className={`cursor-pointer px-3 py-2 rounded border flex items-center justify-between transition-colors ${composition.overheads ? 'bg-purple-900/20 border-purple-700 text-purple-100' : 'bg-[#333] border-gray-600 text-gray-500'}`}>
                                        <div className="flex items-center gap-2"><div className={`w-4 h-4 rounded border flex items-center justify-center ${composition.overheads ? 'bg-purple-500 border-purple-500' : 'border-gray-500'}`}>{composition.overheads && <CheckSquare size={12} className="text-white" />}</div> <span className="text-xs font-bold">Indiretti</span></div>
                                        <span className="text-xs font-mono">€{(results.industrialCostUnit - results.mainMaterialCost - results.additionalMaterialCostTotal - results.transformationCostTotal).toFixed(0)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                                <div className="space-y-1 text-center md:text-left w-full md:w-auto">
                                    <span className="block text-gray-400 text-xs font-bold uppercase tracking-wider">Totale Selezionato (per preventivo)</span>
                                    <div className="text-4xl font-bold text-white font-mono">€ {results.activeCost.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                                    <div className="text-xs text-gray-400">Costo Industriale Completo: €{results.industrialCostUnit.toFixed(2)}</div>
                                </div>
                                <div className="flex flex-col gap-3 w-full md:w-auto">
                                    <div className="w-full">
                                        <span className="text-xs text-gray-400 uppercase font-bold mb-1 block">Descrizione (per Preventivo)</span>
                                        <input 
                                            className="w-full bg-[#333] border border-gray-500 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-400 mb-2"
                                            value={quoteDescription}
                                            onChange={(e) => setQuoteDescription(e.target.value)}
                                            placeholder="Descrizione articolo..."
                                        />
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <div className="flex-1">
                                                <span className="text-xs text-gray-400 uppercase font-bold mb-1 block">Categoria Destinazione</span>
                                                <select className="w-full bg-[#333] border border-gray-500 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-400" value={targetCategoryId} onChange={(e) => setTargetCategoryId(e.target.value)}>
                                                    {categories.map(cat => <option key={cat.id} value={cat.id} className="bg-[#333] text-white">{cat.name}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex items-end pb-2">
                                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                                   <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${explodeQuote ? 'bg-cyan-600 border-cyan-500' : 'border-gray-600 bg-[#333]'}`}>
                                                      {explodeQuote && <CheckSquare size={14} className="text-white" />}
                                                   </div>
                                                   <input type="checkbox" className="hidden" checked={explodeQuote} onChange={() => setExplodeQuote(!explodeQuote)} />
                                                   <span className="text-xs text-gray-300 font-bold uppercase">Dettaglia Voci</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={resetCalculation} className="px-4 py-3 bg-red-900/30 hover:bg-red-900/50 text-red-300 border border-red-800 rounded font-bold uppercase tracking-wider text-sm transition-all flex items-center justify-center gap-2">
                                            <RotateCcw size={18} /> <span className="hidden sm:inline">Azzera</span>
                                        </button>
                                        <button onClick={handleTransferToQuote} className="flex-grow px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-bold uppercase tracking-wider text-sm transition-all shadow-lg flex items-center justify-center gap-2">
                                            <Hammer size={18} /> Aggiungi al Preventivo
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Component: GeneralQuote
        const GeneralQuote = ({ categories, setCategories }) => {
            const [expandedCats, setExpandedCats] = useState(() => {
                const initial = {};
                if (categories.length > 0) initial[categories[0].id] = true;
                return initial;
            });

            const toggleCat = (id) => setExpandedCats(prev => ({ ...prev, [id]: !prev[id] }));

            const addItem = (catId) => {
                const newItem = {
                    id: uuidv4(),
                    categoryId: catId,
                    code: '',
                    description: '',
                    unit: 'cad',
                    quantity: 1,
                    unitCost: 0,
                    markupPercentage: 30,
                    discountPercentage: 0
                };
                setCategories(prev => prev.map(cat => cat.id === catId ? { ...cat, items: [...cat.items, newItem] } : cat));
            };

            const updateItem = (catId, itemId, field, value) => {
                setCategories(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return { ...cat, items: cat.items.map(item => item.id === itemId ? { ...item, [field]: value } : item) };
                }));
            };

            const deleteItem = (catId, itemId) => {
                setCategories(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return { ...cat, items: cat.items.filter(i => i.id !== itemId) };
                }));
            };

            const getRowTotals = (item) => {
                const totalCost = item.unitCost * item.quantity;
                const margin = Math.min(Math.max(item.markupPercentage, 0), 99.9);
                const unitPrice = item.unitCost / (1 - (margin / 100));
                const totalPrice = unitPrice * item.quantity;
                const finalPrice = totalPrice * (1 - item.discountPercentage / 100);
                return { totalCost, unitPrice, totalPrice, finalPrice };
            };

            const getCategoryTotals = (cat) => {
                return cat.items.reduce((acc, item) => {
                    const { totalCost, finalPrice } = getRowTotals(item);
                    return { cost: acc.cost + totalCost, price: acc.price + finalPrice };
                }, { cost: 0, price: 0 });
            };

            return (
                <div className="p-6 text-sm animate-fade-in">
                    <div className="flex justify-between items-end mb-6">
                        <div><h1 className="text-2xl font-bold text-white mb-1">Preventivo Generale</h1><p className="text-gray-400">Analisi costi e proposta commerciale dettagliata.</p></div>
                        <div className="flex gap-3">
                            <div className="flex items-center gap-2 px-4 py-2 bg-[#333] rounded border border-gray-600"><div className="w-3 h-3 rounded-full bg-gray-500"></div> <span className="text-gray-300 font-medium">Interno (Costi)</span></div>
                            <div className="flex items-center gap-2 px-4 py-2 bg-[#333] rounded border border-gray-600"><div className="w-3 h-3 rounded-full bg-cyan-400"></div> <span className="text-cyan-400 font-medium">Commerciale (Prezzi)</span></div>
                        </div>
                    </div>
                    <div className="space-y-4">
                        {categories.map(cat => {
                            const isOpen = expandedCats[cat.id];
                            const catTotals = getCategoryTotals(cat);
                            return (
                                <div key={cat.id} className="border border-gray-700 rounded-lg bg-[#252525] overflow-hidden">
                                    <div className="flex items-center justify-between p-4 bg-[#2a2a2a] cursor-pointer hover:bg-[#333] transition-colors border-b border-gray-700" onClick={() => toggleCat(cat.id)}>
                                        <div className="flex items-center gap-3">
                                            {isOpen ? <ChevronDown className="text-cyan-400" /> : <ChevronRight className="text-gray-500" />}
                                            <h3 className="font-bold text-gray-100 uppercase tracking-wide text-base">{cat.name}</h3>
                                            <span className="bg-gray-700 text-gray-300 text-xs px-2 py-0.5 rounded-full">{cat.items.length} voci</span>
                                        </div>
                                        <div className="flex gap-8 pr-4">
                                            <div className="text-right"><span className="block text-xs text-gray-500 uppercase">Totale Costo</span><span className="font-mono text-gray-300">€ {catTotals.cost.toLocaleString('it-IT', {minimumFractionDigits: 2})}</span></div>
                                            <div className="text-right"><span className="block text-xs text-gray-500 uppercase">Totale Offerta</span><span className="font-mono text-cyan-400 font-bold">€ {catTotals.price.toLocaleString('it-IT', {minimumFractionDigits: 2})}</span></div>
                                        </div>
                                    </div>
                                    {isOpen && (
                                        <div className="p-4 overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="text-xs text-gray-500 border-b border-gray-700">
                                                        <th className="py-2 pl-2 w-12"></th>
                                                        <th className="py-2 w-32">Codice</th>
                                                        <th className="py-2 min-w-[200px]">Descrizione</th>
                                                        <th className="py-2 w-16 text-center">U.M.</th>
                                                        <th className="py-2 w-16 text-center">Q.tà</th>
                                                        <th className="py-2 w-24 text-right bg-gray-800/30 text-gray-400">Costo Unit.</th>
                                                        <th className="py-2 w-24 text-right bg-gray-800/30 text-gray-400">Tot. Costo</th>
                                                        <th className="py-2 w-16 text-center bg-gray-800/30 text-orange-400">Utile %</th>
                                                        <th className="py-2 w-24 text-right text-cyan-100">Prezzo Unit.</th>
                                                        <th className="py-2 w-24 text-right text-cyan-100">Tot. Prezzo</th>
                                                        <th className="py-2 w-16 text-center text-red-400">Sc. %</th>
                                                        <th className="py-2 w-28 text-right font-bold text-cyan-400 pr-2">Finale (€)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-sm">
                                                    {cat.items.map(item => {
                                                        const t = getRowTotals(item);
                                                        return (
                                                            <tr key={item.id} className="border-b border-gray-800 hover:bg-[#2f2f2f] group">
                                                                <td className="py-2 pl-2">
                                                                    <div className="relative w-8 h-8 group-hover:opacity-100 opacity-80 transition-opacity">
                                                                        <div className="absolute inset-0 bg-red-900/40 border border-red-500/50 rounded pointer-events-none"></div>
                                                                        <button 
                                                                          onClick={() => deleteItem(cat.id, item.id)} 
                                                                          className="relative w-full h-full flex items-center justify-center text-red-400 hover:text-white hover:bg-red-600 rounded transition-colors z-10"
                                                                          title="Rimuovi voce"
                                                                        >
                                                                          <Trash2 size={16} />
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                                <td className="py-1 pr-2"><input className="w-full bg-transparent border-b border-transparent focus:border-cyan-500 outline-none text-gray-300" value={item.code} onChange={e => updateItem(cat.id, item.id, 'code', e.target.value)} placeholder="..." /></td>
                                                                <td className="py-1 pr-2"><input className="w-full bg-transparent border-b border-transparent focus:border-cyan-500 outline-none text-gray-300" value={item.description} onChange={e => updateItem(cat.id, item.id, 'description', e.target.value)} placeholder="Descrizione..." /></td>
                                                                <td className="py-1 px-1"><select className="w-full bg-transparent outline-none text-center text-gray-400 text-xs appearance-none" value={item.unit} onChange={e => updateItem(cat.id, item.id, 'unit', e.target.value)}>{UNITS.map(u => <option key={u} value={u}>{u}</option>)}</select></td>
                                                                <td className="py-1 px-1"><input type="number" className="w-full bg-[#333] rounded px-1 text-center text-white focus:outline-none border border-gray-600 focus:border-cyan-500" value={item.quantity} onChange={e => updateItem(cat.id, item.id, 'quantity', parseFloat(e.target.value))} /></td>
                                                                <td className="py-1 px-1 bg-gray-800/30"><input type="number" step="0.01" className="w-full bg-transparent text-right text-gray-400 outline-none focus:text-white border-b border-transparent focus:border-gray-500" value={item.unitCost} onChange={e => updateItem(cat.id, item.id, 'unitCost', parseFloat(e.target.value))} /></td>
                                                                <td className="py-1 px-2 text-right bg-gray-800/30 text-gray-500 font-mono text-xs">{t.totalCost.toLocaleString('it-IT', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                                                                <td className="py-1 px-1 bg-gray-800/30"><input type="number" className="w-full bg-transparent text-center text-orange-400 outline-none border-b border-transparent focus:border-orange-500" value={item.markupPercentage} onChange={e => updateItem(cat.id, item.id, 'markupPercentage', parseFloat(e.target.value))} /></td>
                                                                <td className="py-1 px-2 text-right text-cyan-100/70 font-mono text-xs">{t.unitPrice.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                                <td className="py-1 px-2 text-right text-cyan-100/70 font-mono text-xs">{t.totalPrice.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                                <td className="py-1 px-1"><input type="number" className="w-full bg-transparent text-center text-red-400 outline-none border-b border-transparent focus:border-red-500" value={item.discountPercentage} onChange={e => updateItem(cat.id, item.id, 'discountPercentage', parseFloat(e.target.value))} /></td>
                                                                <td className="py-1 px-2 text-right font-bold text-cyan-400 font-mono bg-cyan-900/10 rounded">{t.finalPrice.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                            <button onClick={() => addItem(cat.id)} className="mt-4 flex items-center gap-1 text-xs text-gray-400 hover:text-cyan-400 transition-colors uppercase font-bold tracking-wider"><Plus size={14} /> Aggiungi Voce</button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // Component: Dashboard
        const Dashboard = ({ categories }) => {
            // --- DATA PROCESSING ENGINE ---
            const stats = useMemo(() => {
                let totalCost = 0;
                let totalRevenue = 0;
                let totalItems = 0;
                let allItems = [];
                let categoryPerformance = [];

                categories.forEach(cat => {
                    let catCost = 0;
                    let catRevenue = 0;

                    cat.items.forEach(item => {
                        const cost = item.unitCost * item.quantity;
                        const margin = Math.min(Math.max(item.markupPercentage, 0), 99.9);
                        const unitPrice = item.unitCost / (1 - (margin / 100));
                        const price = unitPrice * item.quantity * (1 - item.discountPercentage / 100);

                        totalCost += cost;
                        totalRevenue += price;
                        totalItems += 1;
                        catCost += cost;
                        catRevenue += price;

                        allItems.push({
                            name: item.description || item.code || 'N/A',
                            category: cat.name,
                            cost: cost,
                            revenue: price,
                            marginVal: price - cost,
                            marginLimit: item.markupPercentage,
                            quantity: item.quantity
                        });
                    });

                    categoryPerformance.push({
                        name: cat.name.split('.')[1]?.trim().substring(0, 12) || cat.name.substring(0, 10),
                        fullCatName: cat.name,
                        Costi: catCost,
                        Ricavi: catRevenue,
                        Utile: catRevenue - catCost,
                        MarginePerc: catRevenue > 0 ? ((catRevenue - catCost) / catRevenue) * 100 : 0
                    });
                });

                const grossMargin = totalRevenue - totalCost;
                const marginPercent = totalRevenue > 0 ? (grossMargin / totalRevenue) * 100 : 0;
                
                // Sort items for lists
                const topCostItems = [...allItems].sort((a, b) => b.cost - a.cost).slice(0, 5);
                const topMarginItems = [...allItems].sort((a, b) => b.marginVal - a.marginVal).slice(0, 5);

                return { 
                    totalCost, totalRevenue, totalItems, grossMargin, marginPercent, 
                    categoryPerformance, topCostItems, topMarginItems, allItems 
                };
            }, [categories]);

            // --- COLORS PALETTE ---
            const COLORS = {
                revenue: '#00E5FF', // Cyan
                cost: '#555555',    // Gray
                profit: '#32CD32',  // Lime
                chartColors: ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#A259FF', '#F24E1E', '#1ABC9C', '#E74C3C']
            };

            // Custom Tooltip for Charts
